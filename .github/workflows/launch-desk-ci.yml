name: Launch Desk CI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/launch-desk-ci.yml"
      - "docs/launch_desk/**"
      - "launch-desk-frontend/**"
      - "launch_desk/**"
      - "scripts/*launch_desk*"
      - "tests/test_launch_desk_*.py"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/launch-desk-ci.yml"
      - "docs/launch_desk/**"
      - "launch-desk-frontend/**"
      - "launch_desk/**"
      - "scripts/*launch_desk*"
      - "tests/test_launch_desk_*.py"

permissions:
  contents: read

concurrency:
  group: launch-desk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: test-key-for-non-live-ci
      LAUNCH_DESK_RATE_LIMIT_PER_MINUTE: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            launch_desk/requirements.txt
            launch_desk/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r launch_desk/requirements-dev.txt

      - name: Compile Launch Desk Python files
        run: |
          python -m py_compile \
            launch_desk/agent.py \
            launch_desk/payloads.py \
            launch_desk/routes.py \
            launch_desk/tools.py \
            launch_desk/wsgi.py \
            scripts/run_launch_desk_backend.py \
            scripts/verify_launch_desk_stream.py \
            tests/test_launch_desk_agent_contract.py \
            tests/test_launch_desk_routes.py \
            tests/test_launch_desk_tools.py

      - name: Run Launch Desk unit tests
        run: |
          python -m pytest \
            tests/test_launch_desk_tools.py \
            tests/test_launch_desk_routes.py \
            tests/test_launch_desk_agent_contract.py

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launch-desk-frontend
    env:
      NEXT_PUBLIC_LAUNCH_DESK_API_BASE: http://127.0.0.1:5057
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build Launch Desk frontend
        run: npm run build
